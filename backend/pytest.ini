[pytest]
# Run from the backend/ directory so that `app` and `tests` are importable.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: auto-detect and run `async def` tests without an explicit marker.
asyncio_mode = auto

markers =
    api: endpoint / integration tests exercised through the FastAPI app
    services: service-level tests that call service functions directly
    migrations: Alembic migration tests (require PostgreSQL)
